[project]
name = "fastapi-blog"
version = "0.1.0"
description = "FastAPI implementation with Jinja2 Templates"
readme = "README.md"
authors = [
    { name = "Shahid Rahim", email = "shahidrahim.js@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.141.1",
    "sqlalchemy[asyncio]>=2.1.3",
]

[project.scripts]
fastapi-blog = "fastapi_blog:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
